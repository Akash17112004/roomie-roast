name: roomie_roast
description: Smart Flatmate & Hostel Life Manager
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  provider: ^6.1.2

  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  flutter_animate: ^4.5.0
  confetti: ^0.7.0
  fl_chart: ^0.69.0
  shared_preferences: ^2.3.2
  uuid: ^4.5.1
  intl: ^0.19.0

  flutter_local_notifications: ^17.2.1
  timezone: ^0.9.4
  google_fonts: ^8.1.0
  share_plus: ^13.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^4.0.0
  flutter_native_splash: ^2.4.0
flutter:
  uses-material-design: true
  assets:
    - assets/icon/
flutter_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png

flutter_native_splash:
  color: "#7b61ff"
  image: assets/icon/icon.png
  android: true
  ios: true

